[versions]
# sesami-wear と同じ版にそろえる（PLAN D-12）。版を上げるときは両リポジトリで足並みをそろえる
agp = "8.13.0"
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
kotlinxCoroutines = "1.9.0"
kotlinxSerializationJson = "1.7.3"
navigationCompose = "2.8.6"
turbine = "1.2.0"
datastore = "1.1.7"
coil = "2.7.0"
exifinterface = "1.3.7"
glance = "1.2.0"
work = "2.10.5"
# Baseline Profile をインストール時に反映する（Compose が持ち込む版と同じ）
profileinstaller = "1.4.1"
# Baseline Profile の作成・計測（BL-100）。1.4.1（1.3.4 は Android 17 の実機で startActivityAndWait が失敗したため上げた。AGP 8.13・Kotlin 2.0.21 で生成と計測ができることを実機で確かめた）
baselineprofilePlugin = "1.4.1"
benchmarkMacro = "1.4.1"
uiautomator = "2.3.0"
androidxTestExtJunit = "1.2.1"
aboutlibraries = "11.2.3"
ksp = "2.0.21-1.0.27"
room = "2.6.1"
junit = "4.13.2"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
ktlintGradle = "12.1.2"
detekt = "1.23.7"
# スクリーンショットテスト（BL-062、テスト専用で配布物には入らない）。Compose BOM 2024.12 と同じ頃の版
roborazzi = "1.38.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
