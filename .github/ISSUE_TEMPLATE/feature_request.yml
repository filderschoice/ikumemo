name: 機能の要望・改善提案
description: 新しい機能や既存機能の改善を提案する場合はこちら
title: "[Feature] "
labels:
  - "type: 要望"
  - "from: GitHub"
body:
  - type: markdown
    attributes:
      value: |
        ご提案ありがとうございます。個人が余暇に開発しているプロジェクトのため、
        いただいた提案すべてに対応できるとは限りません。あらかじめご了承ください。

        **実装は開発者が行います。本リポジトリでは外部からのPull Requestを受け付けていません。**
        要望を実装するかどうかの判断基準（家計簿・共有・位置情報は扱わない、広告・解析SDKを組み込まない等）は
        [CONTRIBUTING.local.md](https://github.com/filderschoice/ikumemo/blob/main/CONTRIBUTING.local.md)
        に記載しています。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい困りごと
      description: どのような場面で困っているかを書いてください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能・改善内容
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他の方法で回避できるか、試した内容があれば書いてください。
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 補足情報
    validations:
      required: false
